[package]
name = "normalmapper"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.1", features = ["persistence"] }
egui = "0.36.1"
image = "0.25.10"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
